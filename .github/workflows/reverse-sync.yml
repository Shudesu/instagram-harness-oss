name: Reverse Sync from OSS

# Check every 6 hours if OSS has changes not in Private
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add OSS remote and fetch
        run: |
          git remote add oss https://github.com/Shudesu/line-harness-oss.git
          git fetch oss main

      - name: Check for OSS-only commits
        id: check
        run: |
          # Find commits in OSS that mention "Merge pull request"
          # but are NOT from sync (github-actions[bot])
          OSS_COMMITS=$(git log oss/main --oneline --author-date-order \
            --not HEAD \
            --no-merges \
            --perl-regexp --author='^(?!github-actions)' \
            2>/dev/null | head -20)

          if [ -z "$OSS_COMMITS" ]; then
            echo "No new OSS commits to sync"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found OSS commits to sync:"
            echo "$OSS_COMMITS"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            # Save commit list for PR body
            echo "$OSS_COMMITS" > /tmp/oss-commits.txt
          fi

      - name: Create sync branch and cherry-pick
        if: steps.check.outputs.has_changes == 'true'
        id: sync
        run: |
          BRANCH="auto/reverse-sync-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"

          # Get OSS-only commit SHAs (non-bot, not in private)
          SHAS=$(git log oss/main --format='%H' --not HEAD --no-merges \
            --perl-regexp --author='^(?!github-actions)' \
            2>/dev/null | tac)

          SUCCESS=0
          FAILED=0
          for SHA in $SHAS; do
            SUBJECT=$(git log -1 --format='%s' "$SHA")
            echo "Cherry-picking: $SUBJECT ($SHA)"
            if git cherry-pick "$SHA" --no-commit 2>/dev/null; then
              git commit -m "reverse-sync: $SUBJECT (from OSS)" --allow-empty 2>/dev/null
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ⚠️ Conflict — skipping (needs manual merge)"
              git cherry-pick --abort 2>/dev/null
              FAILED=$((FAILED + 1))
            fi
          done

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

          if [ $SUCCESS -eq 0 ]; then
            echo "No commits applied"
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
          else
            git push origin "$BRANCH"
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.sync.outputs.has_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=$(cat /tmp/oss-commits.txt 2>/dev/null || echo "See branch for details")
          gh pr create \
            --title "🔄 Reverse sync: OSS community changes" \
            --body "$(cat <<EOF
          ## OSS → Private 逆マージ

          OSS リポ (line-harness-oss) でマージされた外部 PR の変更を取り込みます。

          ### 取り込んだコミット
          \`\`\`
          $COMMITS
          \`\`\`

          ### ステータス
          - ✅ 成功: ${{ steps.sync.outputs.success }} コミット
          - ⚠️ コンフリクト: ${{ steps.sync.outputs.failed }} コミット（手動マージ必要）

          ### チェックリスト
          - [ ] 変更内容を確認
          - [ ] コンフリクトがある場合は手動解消
          - [ ] マージ後、sync-oss.yml が OSS に正しく反映されるか確認

          > 📋 [OSS 同期憲章](docs/OSS-SYNC-CHARTER.md) セクション 2.2 に基づく自動逆マージ
          EOF
          )" \
            --base main \
            --head "${{ steps.sync.outputs.branch }}"
