name: Sync to OSS

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          path: private

      - name: Checkout OSS repo
        uses: actions/checkout@v4
        with:
          repository: Shudesu/line-harness-oss
          token: ${{ secrets.OSS_PAT }}
          path: oss

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env.production' \
            --exclude='.env.local' \
            --exclude='.env' \
            --exclude='.claude' \
            --exclude='apps/web/out' \
            --exclude='apps/liff/dist' \
            --exclude='docs/superpowers' \
            --exclude='README.md' \
            --exclude='.github/workflows' \
            --exclude='CHANGELOG.md' \
            --exclude='COMPETITOR_FEATURES.md' \
            --exclude='PROGRESS.md' \
            --exclude='SPEC.md' \
            --exclude='.env.example' \
            --exclude='CLAUDE.md' \
            --exclude='.mcp.json' \
            --exclude='*.toml.bak' \
            private/ oss/

      - name: Restore OSS-only files
        run: |
          cd oss
          git checkout HEAD -- LICENSE 2>/dev/null || true
          git checkout HEAD -- README.md 2>/dev/null || true
          git checkout HEAD -- .github/ 2>/dev/null || true

      - name: Clean secrets
        run: |
          cd oss
          find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.md" -o -name "*.toml" -o -name "*.sql" -o -name "*.sh" -o -name "*.json" \) \
            -not -path "*/node_modules/*" -not -path "*/.git/*" \
            -exec sed -i \
              -e 's|b2712617-31c4-47c2-accd-4eec906c44ce|YOUR_D1_DATABASE_ID|g' \
              -e 's|b2712617[^"]*"|YOUR_D1_DATABASE_ID"|g' \
              -e 's|37f8f88be4c099329e4647bda211bb9f|YOUR_ACCOUNT_ID|g' \
              -e 's|c40947ff58a767be74a53be79a89d68a|YOUR_DEV_ACCOUNT_ID|g' \
              -e 's|7efe7c20-01ae-4d65-be08-0d7b4202e8a1|YOUR_DEV_D1_DATABASE_ID|g' \
              -e 's|aiagent\.mini@gmail\.com|your-email@example.com|g' \
              {} +

      - name: Verify no secrets
        run: |
          cd oss
          LEAKS=$(grep -rl "b2712617\|4ed0681\|98ca4e0c\|3723bd16\|37f8f88be4c0\|c40947ff58a7\|aiagent\.mini@gmail" . 2>/dev/null | grep -v node_modules | grep -v ".git/" || true)
          if [ -n "$LEAKS" ]; then
            echo "ERROR: secrets found in:"
            echo "$LEAKS"
            exit 1
          fi
          echo "Clean — no secrets detected"

      - name: Commit and push
        run: |
          cd oss
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "sync: $(git -C ../private log -1 --format='%s')"
            git push
          fi
